name: Activate WetaGold
on:
  workflow_dispatch:
  push:
    branches: [feature/cloud-readiness]
    paths:
      - .github/workflows/cloud-activate.yml
      - scripts/cloud-activate.js
      - test/cloud-activate.test.js
permissions:
  contents: read
concurrency:
  group: wetagold-production-activation
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      github.repository == 'mweta66/oldgold' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/feature/cloud-readiness') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: production
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test activation guards without production credentials
        run: node --test test/cloud-activate.test.js
      - name: Record the exact reviewed production commit
        run: echo "PRODUCTION_COMMIT=$(git -C production rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Activate the matched production projects
        run: node scripts/cloud-activate.js
        env:
          PRODUCTION_TREE: production
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
