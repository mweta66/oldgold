name: WetaGold cloud readiness
on:
  workflow_dispatch:
  # Initial non-mutating verification before this workflow is on the default branch.
  push:
    branches: [feature/cloud-readiness]
    paths:
      - .github/workflows/cloud-readiness.yml
      - scripts/cloud-readiness.js
      - test/cloud-readiness.test.js
permissions:
  contents: read
concurrency:
  group: wetagold-cloud-readiness
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'mweta66/oldgold' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/feature/cloud-readiness') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test sanitization without production credentials
        run: node --test test/cloud-readiness.test.js
      - name: Inspect configured APIs without changing remote state
        run: node scripts/cloud-readiness.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
