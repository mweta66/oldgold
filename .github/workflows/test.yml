name: Verify Xgold
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build:static
      - run: node --test --test-reporter=spec --test-reporter=./scripts/github-test-reporter.js --test-reporter-destination=stdout --test-reporter-destination=stderr test/*.test.js
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-reporter=spec --test-reporter=./scripts/github-test-reporter.js --test-reporter-destination=stdout --test-reporter-destination=stderr test/browser.e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
